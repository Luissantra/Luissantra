<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Explore specific photography and in-game photo galleries in high resolution.">
  <title>Gallery — Photography Portfolio</title>
  
  <link rel="stylesheet" href="styles/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;1,400&family=Orbitron:wght@400..900&family=Rochester&family=Silkscreen:wght@400;700&family=Baumans&display=swap" rel="stylesheet">
  
  <script type="module" src="scripts/main.js"></script>
</head>
<body>
  
  <header class="site-header">
    <nav class="site-nav">
      <div class="site-brand"><a href="index.html">Luissantra</a></div>
      <div class="nav-links">
        <a href="index.html#section-featured" class="nav-link">Featured</a>
        <a href="index.html#section-photography" class="nav-link">Photography</a>
        <a href="index.html#section-in-game" class="nav-link">In-Game</a>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" aria-pressed="false">
          <span id="theme-icon-container" aria-hidden="true">
            <!-- Icon injected by JS -->
          </span>
        </button>
      </div>
    </nav>
  </header>

  <main>
    <!-- JS will inject the gallery photos here -->
    <section id="gallery-content" class="fade-in-up">
      <div class="spinner"></div>
    </section>
  </main>

  <!-- Native HTML Dialog for the Lightbox -->
  <dialog id="lightbox" closedby="any">
    <div class="lightbox-content" tabindex="-1">
      <button class="lightbox-btn lightbox-close" id="lightbox-close" aria-label="Close Lightbox">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
      
      <button class="lightbox-btn lightbox-prev" id="lightbox-prev" aria-label="Previous Image">
        <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </button>
      
      <img id="lightbox-image" class="lightbox-image" src="" alt="Full screen gallery view" decoding="async">
      
      <button class="lightbox-btn lightbox-next" id="lightbox-next" aria-label="Next Image">
        <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
      </button>
    </div>
  </dialog>

</body>
</html>
