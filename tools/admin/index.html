<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography CMS</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link rel="stylesheet" href="/tools/admin/admin.css">
</head>
<body>

    <aside>
        <div class="sidebar-header">
            <h1>Photography CMS</h1>
        </div>
        <div class="gallery-list" id="gallery-list">
            <!-- Galleries injected here -->
        </div>
        <div class="sidebar-footer">
            <button class="btn-secondary" onclick="document.getElementById('new-gallery-dialog').showModal()">+ Nueva Galería</button>
            <button class="btn-primary" onclick="buildProject()">🚀 Build & Optimize</button>
        </div>
    </aside>

    <main>
        <div class="main-header">
            <h2 id="current-gallery-title">Selecciona una galería</h2>
        </div>
        
        <div class="content">
            <div id="upload-section" class="upload-area hidden" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                <div style="font-size: 1.1rem; font-weight: 500; color: #fff;">Arrastra fotos nuevas aquí para subirlas</div>
                <div>o</div>
                <button class="upload-btn" onclick="document.getElementById('file-input').click()">Navegar Archivos</button>
                <input type="file" id="file-input" multiple accept="image/*" onchange="handleFileSelect(event)">
            </div>
            
            <p style="color: #aaa; margin-bottom: 20px;">Arrastra las fotos para cambiar su orden automáticamente.</p>
            <div class="grid" id="sortable-grid">
                <!-- Images injected here -->
            </div>
        </div>

        <div class="loader-overlay" id="loader">
            <div class="spinner"></div>
            <h3 id="loader-text">Procesando...</h3>
        </div>
    </main>

    <dialog id="new-gallery-dialog">
        <h3>Crear Nueva Galería</h3>
        <p style="color: #aaa; font-size: 0.9rem; margin-bottom: 16px;">Introduce un ID único para la carpeta (ej. <code>viaje-japon-2026</code>). Solo minúsculas y guiones.</p>
        <input type="text" id="new-gallery-id" placeholder="id-de-galeria">
        <div class="dialog-actions">
            <button class="btn-secondary" style="width: auto;" onclick="document.getElementById('new-gallery-dialog').close()">Cancelar</button>
            <button class="btn-primary" style="width: auto;" onclick="createGallery()">Crear</button>
        </div>
    </dialog>

    <div class="toast-container" id="toast-container"></div>

    <script src="/tools/admin/admin.js"></script>
</body>
</html>
